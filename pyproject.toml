[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-feature-selection"
version = "0.4.0"
description = "Genetic algorithm for black-box feature subset selection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "GA Feature Selection contributors" },
]
keywords = ["feature-selection", "genetic-algorithm", "evolutionary", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["scikit-learn>=1.3", "pandas>=2.0", "numpy>=1.24"]
test = ["pytest>=7.0"]
parallel = ["cloudpickle>=2.0"]

[tool.setuptools]
py-modules = ["ga_feature_selection_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
